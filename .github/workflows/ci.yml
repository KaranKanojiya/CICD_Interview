# Continuous integration: every push to main and every pull request.
# Build once, test, publish the reports. No deploy here - see release.yml.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: ./gradlew build "-PgitCommit=${GIT_COMMIT::7}"

      - name: Release scripts self-test
        run: bash scripts/test-release-scripts.sh

      - name: Preview next version
        run: bash scripts/next-version.sh || echo "no release-worthy commits"

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
          retention-days: 7

  docker:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew bootJar
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push on CI)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: cicd-demo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
