services:
  jenkins:
    build: .
    image: cicd-demo-jenkins
    container_name: cicd-demo-jenkins
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?run jenkins/up.sh or export JENKINS_ADMIN_PASSWORD}
      JAVA_OPTS: >-
        -Djenkins.install.runSetupWizard=false
        -Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    volumes:
      - jenkins_home:/var/jenkins_home
      - ..:/workspace-repo:ro

volumes:
  jenkins_home:
