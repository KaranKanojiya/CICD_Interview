# Stable track. Spinnaker/Harness substitute the image with the release tag (same artifact everywhere).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicd-demo
  namespace: cicd-demo
  labels:
    app: cicd-demo
    track: stable
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cicd-demo
      track: stable
  template:
    metadata:
      labels:
        app: cicd-demo
        track: stable
    spec:
      containers:
        - name: app
          image: ghcr.io/karankanojiya/cicd_interview
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 512Mi
---
# The Service selects only app=cicd-demo, so it spreads traffic across stable and canary pods by replica count.
apiVersion: v1
kind: Service
metadata:
  name: cicd-demo
  namespace: cicd-demo
spec:
  selector:
    app: cicd-demo
  ports:
    - port: 80
      targetPort: 8080
